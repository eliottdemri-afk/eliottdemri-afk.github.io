<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vin/20 — Par plat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="logo">
      <span class="logo-icon">🍷</span>
      <span class="logo-text"><strong>Vin</strong>/20</span>
    </div>
    <nav class="site-nav">
      <a href="index.html" class="nav-link active">🍽️ Par plat</a>
      <a href="ingredients.html" class="nav-link">🥕 Par ingrédients</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <p class="hero-sub">Accords Mets &amp; Vins</p>
      <h1 class="hero-title">Quel vin avec<br />votre plat ?</h1>

      <form class="search-form" id="searchForm" autocomplete="off">
        <div class="search-wrap">
          <input
            id="searchInput"
            class="search-input"
            type="text"
            placeholder="Ex : magret de canard, sushis, risotto…"
            aria-label="Nom du plat"
          />
          <button class="search-btn" type="submit" aria-label="Rechercher">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </button>
        </div>
        <ul class="dropdown" id="dropdown" hidden></ul>
      </form>
    </section>

    <div class="error-box" id="errorBox">
      <span class="error-icon">💡</span>
      <span class="error-msg" id="errorMsg">Astuce : vous pouvez rechercher en français ou en anglais.</span>
    </div>

    <div id="loader" class="loader-wrap" hidden>
      <span class="loader-glass">🍷</span>
      <p class="loader-text">Sélection en cours…</p>
    </div>

    <section class="results" id="results" hidden>
      <div class="results-inner">
        <p class="results-dish" id="resultDish"></p>
        <ul class="wine-list" id="wineList"></ul>
        <p class="results-source" id="resultSource"></p>
      </div>
    </section>

    <section class="history-section" id="historySection" hidden>
      <p class="history-title">Recherches récentes</p>
      <div class="history-chips" id="historyChips"></div>
    </section>
  </main>

  <footer class="site-footer">
    Fait avec AMOUR par <span>Eliott DEMRI</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
