<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vin/20 — Par ingrédients</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="logo">
      <span class="logo-icon">🍷</span>
      <span class="logo-text"><strong>Vin</strong>/20</span>
    </div>
    <nav class="site-nav">
      <a href="index.html" class="nav-link">🍽️ Par plat</a>
      <a href="ingredients.html" class="nav-link active">🥕 Par ingrédients</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <p class="hero-sub">Accords Mets &amp; Vins</p>
      <h1 class="hero-title">Composez votre plat<br />ingrédient par ingrédient</h1>

      <form class="search-form" id="ingredientForm" autocomplete="off">
        <div class="search-wrap">
          <input
            id="ingredientInput"
            class="search-input"
            type="text"
            placeholder="Ex : saumon, crème, champignons…"
            aria-label="Ajouter un ingrédient"
          />
          <button class="search-btn" type="submit" aria-label="Ajouter">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>
      </form>

      <div class="chips-wrap" id="chipsWrap" hidden>
        <div class="ingredient-chips" id="ingredientChips"></div>
        <button class="find-btn" id="findBtn" type="button">Trouver un vin 🍷</button>
      </div>
    </section>

    <div class="error-box" id="errorBox">
      <span class="error-icon">💡</span>
      <span class="error-msg" id="errorMsg">Ajoutez vos ingrédients un par un, en français ou en anglais.</span>
    </div>

    <div id="loader" class="loader-wrap" hidden>
      <div class="loader-dots"><span></span><span></span><span></span></div>
      <p class="loader-text">Analyse en cours…</p>
    </div>

    <section class="results" id="results" hidden>
      <div class="results-inner">
        <p class="results-dish" id="resultDish"></p>
        <ul class="wine-list" id="wineList"></ul>
        <p class="results-source" id="resultSource"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    Fait avec AMOUR par <span>Eliott DEMRI</span>
  </footer>

  <script src="ingredients.js"></script>
</body>
</html>
